<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SLAB/16 — sampling groovebox</title>
    <meta name="description" content="A 16-pad sampler and sequencer that runs in the browser. Load or record samples, chop them, and build beats." />
    <meta name="theme-color" content="#161514" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="modulepreload" href="./dist/main.js" />
    <script type="module" src="./dist/main.js"></script>
  </head>
  <body>
    <nav class="chrome" aria-label="Interface and help">
      <div class="switch" role="group" aria-label="Interface">
        <button type="button" class="icon" data-view="sampler" aria-pressed="true" aria-label="Sampler" title="Sampler (`)"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg></button>
        <button type="button" class="icon" data-view="keys" aria-pressed="false" aria-label="Keyboard" title="Keyboard (`)"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect class="outline" x="2.5" y="4" width="15" height="12" rx="1.5"/><path class="outline" d="M6.25 11v5M10 11v5M13.75 11v5"/><rect x="5" y="4" width="2.5" height="7" rx="0.6"/><rect x="8.75" y="4" width="2.5" height="7" rx="0.6"/><rect x="12.5" y="4" width="2.5" height="7" rx="0.6"/></svg></button>
      </div>
      <a href="./help.html" target="_blank" rel="noopener">Guide</a>
      <button type="button" id="open-tour">Tour</button>
      <button type="button" id="open-shortcuts">Shortcuts <kbd>?</kbd></button>
    </nav>
    <slab-app></slab-app>
    <slab-keys hidden></slab-keys>
    <noscript>
      <p class="fallback">SLAB/16 is an instrument built with Web Audio and needs JavaScript to run.</p>
    </noscript>
  </body>
</html>
